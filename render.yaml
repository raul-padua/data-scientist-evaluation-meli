services:
  - type: web
    name: item-condition-predictor-api
    env: python
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
    
# Render will install system packages from apt.txt if present
